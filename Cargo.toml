[workspace]
resolver = "3"
members = [
    "platform-editor",
    "platform-editor-core"
]

[workspace.dependencies]
platform-editor = { path = "platform-editor" }
platform-editor-core = { path = "platform-editor-core" }

sdl3 = { version = "0.18.3", features = ["image", "build-from-source"] }
sdl3-sys = "0.6.5"